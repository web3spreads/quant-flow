[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# 统一入口：单一 main.py 进程，内部按 PERP_ENABLED/GRID_ENABLED 开关
# （由 docker-entrypoint.sh 从 RUN_MODE 映射）决定运行永续 / 网格 / 两者并行。
[program:quant-flow]
command=bash -c 'python main.py --config %(ENV_MAIN_CONFIG)s 2>&1 | tee -a /app/logs/main.log'
user=%(ENV_APP_USER)s
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
