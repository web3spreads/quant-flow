services:
  quant-flow:
    build: .
    container_name: quant-flow
    restart: unless-stopped
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - HYPERLIQUID_PRIVATE_KEY=${HYPERLIQUID_PRIVATE_KEY}
      - HYPERLIQUID_ACCOUNT_ADDRESS=${HYPERLIQUID_ACCOUNT_ADDRESS:-}
      - HYPERLIQUID_TESTNET=${HYPERLIQUID_TESTNET:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./config.yaml:/app/config.yaml:ro   # 策略配置（永续/网格开关都在这里）
      - ./logs:/app/logs                    # 运行日志与结构化记录
      - ./data:/app/data                    # 网格状态与风控状态持久化
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
