[project]
name = "quant-flow"
version = "0.6.0"
description = "AI 驱动的加密货币自动交易系统 - Hyperliquid 永续合约与网格策略"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 交易所 SDK
    "hyperliquid-python-sdk>=0.21.0",
    "eth-account>=0.13.7",

    # 数据处理与技术指标
    "pandas>=2.3.0",
    "numpy>=2.0.0",

    # LLM 调用与外部 HTTP
    "requests>=2.31.0",

    # 配置与模板
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Ruff 配置
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # 行长由 formatter 处理
    "B008",   # 默认参数中的函数调用
    "B905",   # zip 缺省 strict
    "SIM108", # 三元表达式（按可读性取舍）
    "SIM102", # 嵌套 if（复杂条件下更可读）
    "SIM116", # if/elif 换字典查表（少量分支时 if/elif 更清晰）
    "B904",   # raise from（避免回溯噪音）
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Pytest 配置
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
