[project]
name = "quant-flow"
version = "0.4.0"
description = "基于 LangChain Agent 的 AI 驱动加密货币自动交易机器人 - Hyperliquid 永续合约"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.1.2",
    "langchain-core>=1.1.1",
    "langchain-openai>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-exa>=1.0.0",
    "langchain-cloudflare>=0.1.11",
    "langchain-google-genai>=4.1.2",
    "langchain-litellm>=0.3.5",
    "langchain-nvidia-ai-endpoints>=1.0.0",
    "langgraph>=1.0.4",
    "openai>=2.9.0",
    "hyperliquid-python-sdk>=0.21.0",
    "eth-account>=0.13.7",
    "pandas>=2.3.3",
    "numpy>=2.3.5",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.1",
    "apscheduler>=3.11.1",
    "colorama>=0.4.6",
    "rich>=14.2.0",
    "apprise>=1.9.5",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=3.6.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Ruff 配置
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B905",   # zip without strict
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# Pytest 配置
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# MyPy 配置（逐步启用）
[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    ".venv/",
]
