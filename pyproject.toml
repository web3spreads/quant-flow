[project]
name = "quant-flow"
version = "0.5.0"
description = "基于 LangChain Agent 的 AI 驱动加密货币自动交易机器人 - Hyperliquid 永续合约"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LangChain 核心（langchain 主包不直接使用，通过子包导入）
    "langchain-core>=1.2.0",
    "langgraph>=1.0.4",

    # LLM 供应商（全部通过 llm_client.py 条件导入，按需加载）
    "langchain-openai>=1.1.0",
    "langchain-cloudflare>=0.1.11",
    "langchain-google-genai>=4.1.2",
    "langchain-litellm>=0.3.5",
    "langchain-nvidia-ai-endpoints>=1.0.0",

    # 外部信息搜索
    "langchain-exa>=1.0.0",

    # 交易所 SDK
    "hyperliquid-python-sdk>=0.21.0",
    "eth-account>=0.13.7",

    # 数据处理
    "pandas>=2.3.0",
    "numpy>=2.0.0",

    # 配置和环境
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",

    # 调度和通知
    "apscheduler>=3.11.0",
    "apprise>=1.9.0",

    # 终端 UI
    "rich>=14.0.0",

    # 云端日志（aepipe 服务 SDK）
    "aepipe-sdk>=0.1.1",

    # 容器内多进程管理（Docker 部署需要，supervisord 通过 PATH 调用）
    "supervisor>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=3.6.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Ruff 配置
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B905",   # zip without strict
    "SIM108", # ternary operator
    "SIM102", # nested if (intentional for readability in complex conditions)
    "SIM116", # dict lookup instead of if/elif (if/elif is clearer for few cases)
    "B904",   # raise from (can cause traceback noise)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"] # Allow non-top imports in test files (needed for path setup)

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# Pytest 配置
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# MyPy 配置（逐步启用）
[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    ".venv/",
]
