[project]
name = "quant-flow"
version = "0.4.0"
description = "基于 LangChain Agent 的 AI 驱动加密货币自动交易机器人 - Hyperliquid 永续合约"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0.3",
    "langchain-core>=1.0.2",
    "langchain-openai>=1.0.1",
    "langchain-community>=0.4.1",
    "langgraph>=1.0.2",
    "openai>=1.60.0",
    "hyperliquid-python-sdk>=0.6.0",
    "eth-account>=0.11.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
    "colorama>=0.4.6",
    "rich>=13.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
