# ==========================================
# Quant Flow - Prompt 配置文件
# ==========================================
#
# 说明:
# 1. 可以定义多套 Prompt 配置供不同策略使用
# 2. 通过修改 config.yaml 中的 prompt_set 来切换不同的 Prompt
# 3. 每套 Prompt 包含：系统 Prompt、交易 Prompt、现货 Prompt
# 4. 支持自定义新的 Prompt 集合用于策略调优和 A/B 测试

# 当前使用的 Prompt 集合名称
# 可选值: default, conservative, aggressive, 或自定义名称
active_set: default

# Prompt 集合定义
prompt_sets:
  # 默认策略（平衡型）
  default:
    name: "默认策略"
    description: "平衡的交易策略，适合大多数市场环境"

    # 系统 Prompt（定义 AI 角色）
    system_prompt_file: "default/system_prompt.md"

    # 现货系统 Prompt
    spot_system_prompt_file: "default/spot_system_prompt.md"

    # 交易决策 Prompt 模板
    trading_prompt_template_file: "default/trading_prompt_template.md"

    # 现货定投 Prompt 模板
    spot_prompt_template_file: "default/spot_prompt_template.md"
    review_system_prompt_file: "default/review_system_prompt.md"
    review_prompt_template_file: "default/review_prompt_template.md"

  # 保守策略（低风险）
  conservative:
    name: "保守策略"
    description: "极度严格的开仓条件，极低的杠杆使用，资金安全优先"
    system_prompt_file: "conservative/system_prompt.md"
    spot_system_prompt_file: "conservative/spot_system_prompt.md"
    trading_prompt_template_file: "conservative/trading_prompt_template.md"
    spot_prompt_template_file: "conservative/spot_prompt_template.md"
    review_system_prompt_file: "default/review_system_prompt.md"
    review_prompt_template_file: "default/review_prompt_template.md"

  # 激进策略（高风险高收益）
  aggressive:
    name: "激进策略"
    description: "宽松的开仓条件，高杠杆使用，追求收益最大化"
    system_prompt_file: "aggressive/system_prompt.md"
    spot_system_prompt_file: "aggressive/spot_system_prompt.md"
    trading_prompt_template_file: "aggressive/trading_prompt_template.md"
    spot_prompt_template_file: "aggressive/spot_prompt_template.md"
    review_system_prompt_file: "default/review_system_prompt.md"
    review_prompt_template_file: "default/review_prompt_template.md"

  # Alpha Arena博客复刻版
  nof1:
    name: "nof1.ai复刻策略"
    description: "nof1.ai风格的prompt，模仿其交易逻辑和风格"
    system_prompt_file: "nof1/system_prompt.md"
    spot_system_prompt_file: "nof1/spot_system_prompt.md"
    trading_prompt_template_file: "nof1/trading_prompt_template.md"
    spot_prompt_template_file: "nof1/spot_prompt_template.md"
    review_system_prompt_file: "default/review_system_prompt.md"
    review_prompt_template_file: "default/review_prompt_template.md"

  # Alpha Arena 重制版
  nof1-improved:
    name: "nof1.ai改进策略"
    description: "nof1.ai风格的改进版prompt，优化了部分交易逻辑"
    system_prompt_file: "nof1-improved/system_prompt.md"
    spot_system_prompt_file: "nof1-improved/spot_system_prompt.md"
    trading_prompt_template_file: "nof1-improved/trading_prompt_template.md"
    spot_prompt_template_file: "nof1-improved/spot_prompt_template.md"
    review_system_prompt_file: "default/review_system_prompt.md"
    review_prompt_template_file: "default/review_prompt_template.md"

# 使用说明:
# 1. 创建新的 Prompt 集合:
#    - 在 prompts/ 目录下创建新文件夹（如 prompts/my_strategy/）
#    - 复制 default 目录中的文件到新文件夹
#    - 根据需要修改 Prompt 内容
#    - 在上面添加新的配置项
#
# 2. 切换 Prompt 集合:
#    - 修改 config.yaml 中的 prompt.set 字段
#    - 或修改本文件的 active_set 字段
#    - 重启程序即可生效
#
# 3. A/B 测试:
#    - 创建多个 Prompt 集合
#    - 分别运行并记录性能数据
#    - 选择表现最好的策略
