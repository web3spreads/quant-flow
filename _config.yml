# Jekyll 配置
# 排除不需要被 Jekyll Liquid 引擎处理的目录和文件
# prompts/ 目录使用 Jinja2 模板语法（如 {% elif %}），
# Jekyll 的 Liquid 引擎不支持该标签，会导致 GitHub Pages 构建失败
exclude:
  - prompts/
  - src/
  - tests/
  - scripts/
  - data/
  - backtest_results/
  - logs/
  - venv/
  - uv.lock
  - pyproject.toml
  - "*.py"
  - Dockerfile
  - docker-compose.yml
  - docker-entrypoint.sh
  - supervisord.conf
  - init-deployment.sh
