<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Premium golden AI gradient representing wealth and profit -->
    <linearGradient id="gold-aurora" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Soft golden glow for the sparkle of profit -->
    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ascending trend chart breakout line pointing up-right (White for Dark Mode) -->
  <path d="M 20,75 L 45,45 L 53,53 L 72,30" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Up-right arrowhead at the breakout point -->
  <path d="M 62,30 H 72 V 40" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Glowing golden Gemini sparkle representing wealth & success -->
  <path d="M 80,6 C 80,14 76,18 68,18 C 76,18 80,22 80,30 C 80,22 84,18 92,18 C 84,18 80,14 80,6 Z" fill="url(#gold-aurora)" filter="url(#gold-glow)" />
</svg>
