<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gemini-inspired ultra-premium AI gradient -->
    <linearGradient id="gemini-aurora" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="30%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Subtle drop shadow glow for the sparkle -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Grok-style sharp, bold mathematical slash -->
  <path d="M 32,80 L 56,20 H 64 L 40,80 Z" fill="#ffffff" />

  <!-- Gemini 4-point sparkle of intelligence -->
  <path d="M 68,16 C 68,26 63,31 53,31 C 63,31 68,36 68,46 C 68,36 73,31 83,31 C 73,31 68,26 68,16 Z" fill="url(#gemini-aurora)" filter="url(#subtle-glow)" />
</svg>
